name: iOS Unsigned IPA Build

on:
  push:
    branches:
      - dev
      - ios-unsigned-ipa
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-unsigned:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Build KMP iOS framework
        run: ./gradlew :composeApp:assembleReleaseXCFramework

      - name: Build iOS archive (unsigned)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -archivePath $RUNNER_TEMP/MusicAssistant.xcarchive \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/ipa/Payload
          cp -r "$RUNNER_TEMP/MusicAssistant.xcarchive/Products/Applications/iosApp.app" \
            $RUNNER_TEMP/ipa/Payload/
          cd $RUNNER_TEMP/ipa
          zip -r MusicAssistant-unsigned.ipa Payload/

      - name: Get vars
        id: vars
        run: echo "timestamp=$(date -u +'%Y.%m.%d.%H%M')" >> $GITHUB_OUTPUT

      - name: Create and push Git tag
        id: tag
        run: |
          TAG=ios-debug-${{ steps.vars.outputs.timestamp }}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release and Upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "🍎 iOS Debug Build ${{ steps.vars.outputs.timestamp }}"
          body: |
            ## iOS Unsigned IPA Release

            ### What's New
            ${{ github.event.head_commit.message }}

            ### Important Notes
            - This is an **unsigned IPA** — it cannot be installed directly
            - You must re-sign it locally before installing on a device
            - This is a debug build — not intended for production use

            ### Installation
            Download the IPA below and re-sign using one of these tools:
            - **[Sideloadly](https://sideloadly.io/)** — easiest, GUI, free Apple ID works
            - **[AltStore](https://altstore.io/)** — drag and drop re-signing
            - **zsign** — command line option
          files: ${{ runner.temp }}/ipa/MusicAssistant-unsigned.ipa
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}