name: iOS Unsigned IPA Build

on:
  push:
    branches: [main, dev, ios-unsigned-ipa]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build-ios-unsigned:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Install CocoaPods dependencies
        run: |
          cd iosApp
          pod install --repo-update

      - name: Build iOS archive (unsigned)
        run: |
          xcodebuild -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -archivePath $RUNNER_TEMP/MusicAssistant.xcarchive \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/ipa/Payload
          cp -r "$RUNNER_TEMP/MusicAssistant.xcarchive/Products/Applications/iosApp.app" \
            $RUNNER_TEMP/ipa/Payload/
          cd $RUNNER_TEMP/ipa
          zip -r MusicAssistant-unsigned.ipa Payload/

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicAssistant-iOS-unsigned-${{ github.sha }}
          path: $RUNNER_TEMP/ipa/MusicAssistant-unsigned.ipa
          retention-days: 30